<mat-toolbar class="custom-toolbar">
  <span>{{ dynamicContent }}</span>
  <mat-form-field class="language-selector">
    <mat-select placeholder="Translate" (selectionChange)="handleUserClick($event.value)">
      @for (language of languages; track language) {
        <mat-option [value]="language.code">
          {{ language.viewValue }}
        </mat-option>
      }
    </mat-select>
  </mat-form-field>
</mat-toolbar>
