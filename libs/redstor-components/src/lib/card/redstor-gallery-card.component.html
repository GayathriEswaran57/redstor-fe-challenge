<mat-card class="gallery-item thumbnails" (click)="handleUserClick(photos)">
  <img mat-card-image [src]="ImgSrc" [alt]="altDescription" />
  @if (likes) {
    <mat-card-content fxLayout="row" fxLayoutAlign="end" fxLayoutGap="12px">
      <p>
        <mat-icon inline>favorite</mat-icon>
        {{ photos.likes }} {{ dynamicContent }}
      </p>
    </mat-card-content>
  } @else {
    <mat-card-content>
      <p class="title" style="padding-top: 12px">{{ photos.title }}</p>
    </mat-card-content>
  }
</mat-card>
